<section>
  <h2>Ranking</h2>
  <table>
    <thead></thead>
    <tbody>

  @for (user of top; track $index){
    <tr>
      <td>
        <a>{{$index + 1}}</a>
      </td>
      <td>

        <span>{{this.getInitials(user.name)}}</span>
      </td>
      <td>
        <p>{{user.score}}</p>
      </td>

   </tr>
  }

    </tbody>
  </table>
</section>

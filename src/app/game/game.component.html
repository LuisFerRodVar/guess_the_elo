<main [ngClass]= "{'end': end}">
  @if (isLoading){
    <span class="loader"></span>
  }@else {

  @if (end){
    <strong>
      <span>Puntuación: </span>
      <p>{{getTotalScore()}}</p>
      <input (input)="setCurrentAnswer($event)" type="text"placeholder="Digite su nombre acá" >
      <small>En el ranking aparecerán sus iniciales: {{this.initials}}</small>
      <button (click)= "saveData()" >Volver</button>
    </strong>
  }@else{


  <app-game-tabs [scores]= "scores"/>
  <section>
    <aside>
      <app-board [board]= "board" />
      <app-control-panel [gamesList]= "gamesList" [(board)]= "board" [(currentGame)] = "currentGame" [(currentMove)] = "currentMove" />
    </aside>
    <div>
      <app-pgn-viewer [gamesList]= "gamesList" [(board)]= "board" [(currentGame)] = "currentGame" [(currentMove)] = "currentMove" />
      <app-match-info [currentMove] = "currentMove" [currentGame] ="currentGame" [matchsPgn] = "matchsPgn" />
      <app-player-input  [(end)] = "end" [(board)] = "board" [matchsPgn] = "matchsPgn" [(currentMove)] = "currentMove" [(currentGame)] = "currentGame" [(scores)] = "scores" />
    </div>
  </section>
  }
  }
</main>
